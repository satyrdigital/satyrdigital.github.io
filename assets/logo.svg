<?xml version="1.0" encoding="UTF-8"?>
<svg class="sd-logo" id="Layer_1" xmlns="http://www.w3.org/2000/svg" baseProfile="tiny" version="1.2" viewBox="0 0 414 180">
  <defs>
    <radialGradient id="sd-shimmer" gradientUnits="userSpaceOnUse" cx="90" cy="90" r="88">
      <stop offset="0"   class="s s0" stop-color="#00f0ff"/>
      <stop offset="0.2" class="s s1" stop-color="#00f0ff"/>
      <stop offset="0.4" class="s s2" stop-color="#00f0ff"/>
      <stop offset="0.6" class="s s3" stop-color="#00f0ff"/>
      <stop offset="0.8" class="s s4" stop-color="#00f0ff"/>
      <stop offset="1"   class="s s5" stop-color="#00f0ff"/>
    </radialGradient>
    <style>
      /* wordmark follows theme text color (currentColor); icon shimmers aqua-lime */
      .sd-logo { color:#1a1814; }
      @media (prefers-color-scheme: dark) { .sd-logo { color:#f8fafc; } }
      @keyframes sd-shimmer-kf { 0%,100% { stop-color:#00f0ff; } 50% { stop-color:#ccff00; } }
      .s  { animation: sd-shimmer-kf 3.6s ease-in-out infinite; }
      .s0 { animation-delay:-1.20s; }
      .s1 { animation-delay:-0.96s; }
      .s2 { animation-delay:-0.72s; }
      .s3 { animation-delay:-0.48s; }
      .s4 { animation-delay:-0.24s; }
      .s5 { animation-delay: 0s;    }
      @media (prefers-reduced-motion: reduce) {
        .s { animation: none; }
        .s0,.s1 { stop-color:#00f0ff; }
        .s2 { stop-color:#66f5cc; }
        .s3 { stop-color:#99f899; }
        .s4,.s5 { stop-color:#ccff00; }
      }
    </style>
  </defs>
